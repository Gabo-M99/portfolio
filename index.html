<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Inter+Tight:wght@300;400&family=Inter:wght@400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen card table seen from above. Deck centered, the hand fans out along the bottom edge toward the viewer. */
:root {
  --felt: #0f3d3a;
  --felt-deep: #082624;
  --card: #f7f6f2;
  --ink: #17201f;
  --back: #7a1f2b;
  --brass: #c9a24a;
  --muted: #9fb8b4;
  --display: "Gloock", "Georgia", serif;
  --body: "Bricolage Grotesque", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --cw: clamp(78px, 13vw, 150px);
  --ch: calc(var(--cw) * 1.4);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--felt-deep);
  color: var(--card);
  font-family: var(--body);
  overflow: hidden;
}
.table {
  position: relative;
  height: 100%;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(255,255,255,.07), transparent 60%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.035) 0 2px, transparent 2px 5px),
    radial-gradient(ellipse at 50% 50%, var(--felt) 0%, var(--felt-deep) 100%);
  touch-action: none;
  user-select: none;
}
.rail {
  position: absolute; inset: 14px;
  border: 1px solid rgba(201,162,74,.28);
  border-radius: 28px;
  pointer-events: none;
}
.brand {
  position: absolute; top: 28px; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: baseline;
  padding-left: max(36px, calc(env(safe-area-inset-left, 0px) + 20px));
  padding-right: max(36px, calc(env(safe-area-inset-right, 0px) + 20px));
  gap: 16px;
  pointer-events: none;
}
.brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(20px, 3vw, 30px); letter-spacing: .01em; }
.brand p { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hint {
  position: absolute; left: 0; right: 0; top: 42%; margin: 0;
  text-align: center;
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted);
  transform: translateY(calc(var(--ch) * -0.5 - 44px));
  opacity: 0; transition: opacity .5s;
  pointer-events: none;
  padding-inline: 16px;
}
.hint.on { opacity: 1; }
.dropzone {
  position: absolute; left: 50%; top: 42%;
  width: calc(var(--cw) * 1.5); height: calc(var(--ch) * 1.5);
  transform: translate(-50%, -50%);
  border: 1.5px dashed rgba(201,162,74,.0);
  border-radius: 14px;
  transition: border-color .3s, background .3s;
  pointer-events: none;
}
.dropzone.on { border-color: rgba(201,162,74,.45); }
.dropzone.hot { border-color: var(--brass); background: rgba(201,162,74,.08); }

/* Deck */
.deck {
  position: absolute; left: 50%; top: 42%;
  width: var(--cw); height: var(--ch);
  transform: translate(-50%, -50%);
  border: 0; padding: 0; background: none; cursor: pointer;
}
.deck .stack { position: absolute; inset: 0; border-radius: 9px; }
.deck:focus-visible { outline: 2px solid var(--brass); outline-offset: 8px; border-radius: 10px; }
.deal-label {
  position: absolute; left: 50%; top: calc(100% + 26px);
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: var(--display); font-size: clamp(22px, 3.2vw, 34px);
  color: var(--card);
  animation: breathe 2.4s ease-in-out infinite;
}
.deal-label small { display: block; text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--brass); margin-top: 6px; }
@keyframes breathe { 50% { opacity: .55; } }
.deck.dealt .deal-label { opacity: 0; animation: none; transition: opacity .3s; }

.back-face {
  background-color: var(--back);
  background-image:
    repeating-linear-gradient(45deg, rgba(201,162,74,.35) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(-45deg, rgba(201,162,74,.35) 0 1px, transparent 1px 9px);
  border: 5px solid var(--card);
  box-sizing: border-box;
  border-radius: 9px;
  box-shadow: inset 0 0 0 2px var(--brass);
}
.back-face::after {
  content: "G*"; position: absolute; inset: 0;
  display: grid; place-items: center;
  font-family: var(--display); font-size: calc(var(--cw) * .38); color: var(--brass);
}

/* Cards */
.card {
  position: absolute; left: 50%; top: 42%;
  width: var(--cw); height: var(--ch);
  margin: calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);
  border: 0; padding: 0; background: none;
  perspective: 900px;
  cursor: grab;
  transition: transform .7s cubic-bezier(.2,.8,.2,1);
  will-change: transform;
}
.card.dragging { transition: none; cursor: grabbing; z-index: 50 !important; }
.card:focus-visible { outline: none; }
.card:focus-visible .front { box-shadow: 0 0 0 3px var(--brass), 0 10px 24px rgba(0,0,0,.4); }
.inner {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.3,.7,.2,1);
  transform: rotateY(180deg);
}
.card.up .inner { transform: rotateY(0deg); }
.front, .back-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
}
.back-face { transform: rotateY(180deg); }
.front {
  background: var(--card); color: var(--ink);
  border-radius: 9px;
  display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(var(--cw) * .07);
  box-sizing: border-box;
  text-align: left;
  overflow: hidden;
}
.corner { font-family: var(--display); line-height: .9; font-size: calc(var(--cw) * .17); }
.corner span { display: block; font-size: .8em; }
.corner.bottom { justify-self: end; transform: rotate(180deg); }
.red { color: #b3263a; }
.pip {
  display: grid; place-items: center; align-content: center; gap: 4px;
  text-align: center;
}
.pip .suit { font-size: calc(var(--cw) * .32); line-height: 1; }
.pip .title { font-family: var(--body); font-weight: 800; font-size: calc(var(--cw) * .1); line-height: 1.05; text-wrap: balance; }
.pip .cat { font-family: var(--mono); font-size: calc(var(--cw) * .062); letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.card.in-hand:hover:not(.dragging) { transform: var(--rest) translateY(-18px) !important; }

.gather {
  position: absolute; right: max(32px, calc(env(safe-area-inset-right, 0px) + 20px)); top: 72px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); background: transparent; border: 1px solid rgba(159,184,180,.35);
  border-radius: 999px; padding: 8px 14px; cursor: pointer;
  opacity: 0; pointer-events: none; transition: opacity .4s;
  z-index: 60;
}
.gather.on { opacity: 1; pointer-events: auto; }
.gather:hover, .gather:focus-visible { color: var(--card); border-color: var(--brass); outline: none; }

.pip .thumb { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; display: block; margin-bottom: 4px; }
.card.has-thumb .pip .suit, .card.has-thumb .corner.bottom { display: none; }

/* Job page: mirrors the layout of gabomoraes.work/work/* (black page, Inter Tight, full-bleed film, meta row, gallery rows, about block). */
.page {
  --pg-bg: #000; --pg-fg: #faf5f5; --pg-dim: #8f8f8f; --pg-faint: #666; --pg-hot: #ffff00;
  --pg-font: "Inter Tight", "Inter", system-ui, sans-serif;
  --pg-gut: clamp(16px, 1.75vw, 30px);
  --pg-radius: clamp(12px, 1.75vw, 30px);
  position: fixed; inset: 0; z-index: 100;
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--pg-bg); color: var(--pg-fg);
  font-family: var(--pg-font); font-weight: 400;
  opacity: 0; transform: translateY(28px);
  transition: opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1);
  user-select: text;
}
.page.open { opacity: 1; transform: none; }
.pg-inner { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pg-pad { padding-left: max(var(--pg-gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--pg-gut), env(safe-area-inset-right, 0px)); }
.page button.link { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-transform: inherit; }
.page a { color: inherit; text-decoration: none; }
.page :focus-visible { outline: 2px solid var(--pg-hot); outline-offset: 3px; }
.crumbs { display: flex; align-items: center; gap: 14px; padding-block: 18px; font-size: clamp(15px, 1.2vw, 20px); color: var(--pg-dim); text-transform: uppercase; flex-wrap: wrap; }
.crumbs .arrow { opacity: .8; }
.page .crumbs .hot { color: var(--pg-hot); }
.crumbs .here { color: var(--pg-fg); }
.crumbs .rank { margin-left: auto; font-family: var(--display); font-size: 1.3em; color: var(--pg-fg); text-transform: none; }
.crumbs .rank.red { color: #ff4d5e; }
.crumbs button.link:hover { color: var(--pg-fg); }
.pg-head { display: grid; grid-template-columns: 1fr 1fr; gap: 24px var(--pg-gut); padding-block: clamp(32px, 5vw, 80px) clamp(28px, 4vw, 64px); align-items: start; }
.pg-head > * { min-width: 0; }
.pg-head h1 { margin: 0; font-family: var(--pg-font); font-weight: 400; font-size: clamp(40px, 4.4vw, 75px); line-height: .92; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.pg-sub { display: flex; gap: clamp(24px, 6vw, 96px); margin-top: 10px; font-family: "Inter", var(--pg-font); font-size: 14px; color: var(--pg-faint); text-transform: uppercase; }
.pg-label { margin: 0 0 14px; font-family: "Inter", var(--pg-font); font-size: 14px; color: var(--pg-faint); text-transform: uppercase; }
.pg-head p.over, .pg-about p { margin: 0; font-size: clamp(17px, 1.2vw, 20px); line-height: 1.2; max-width: 34em; }
.pg-row { display: flex; gap: var(--pg-gut); margin: 0 auto var(--pg-gut); }
.pg-row.full { margin-bottom: clamp(28px, 2.6vw, 45px); }
.pg-row:not(.full) { padding-left: max(var(--pg-gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--pg-gut), env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.pg-item { position: relative; min-width: 0; border-radius: var(--pg-radius); overflow: hidden; background: #111; }
.pg-row.full .pg-item { border-radius: 0; }
.pg-item img, .pg-item iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; display: block; }
.pg-item.ph { background: linear-gradient(135deg, var(--a), var(--b)); display: grid; place-items: center; }
.pg-item.ph span, .pg-item.ph a { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.85); }
.pg-item.ph a { border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 10px 18px; background: rgba(0,0,0,.35); }
.pg-meta { display: grid; grid-template-columns: minmax(0, 1fr) repeat(2, minmax(0, 1fr)) minmax(0, 2fr) minmax(0, 1fr); gap: 16px var(--pg-gut); padding-block: 10px clamp(48px, 6vw, 110px); text-transform: uppercase; font-size: clamp(16px, 1.2vw, 20px); }
.pg-meta .arrow { justify-self: end; color: var(--pg-dim); }
.pg-meta h3 { margin: 0 0 10px; font-weight: 400; font-size: inherit; color: var(--pg-dim); }
.pg-meta p { margin: 0 0 16px; line-height: 1.2; }
.pg-meta .team p { text-transform: none; }
.pg-about { display: grid; grid-template-columns: 1fr 1fr; gap: 20px var(--pg-gut); padding-block: clamp(36px, 4vw, 70px) clamp(48px, 5vw, 90px); }
.pg-about h2 { margin: 0; font-weight: 400; font-size: clamp(32px, 2.9vw, 50px); line-height: 1; }
.pg-about .award { margin-top: 18px; font-size: 14px; color: var(--pg-dim); text-transform: uppercase; }
.pg-foot { display: grid; grid-template-columns: 1fr 1fr; padding-block: clamp(60px, 7vw, 120px) 40px; font-size: clamp(16px, 1.2vw, 20px); text-transform: uppercase; }
.pg-foot button { color: var(--pg-hot) !important; text-align: left; }
.pg-foot .next { justify-self: start; text-align: left; }
.pg-foot small { display: block; margin-top: 6px; color: var(--pg-dim); font-size: 14px; }
.pg-social { display: flex; flex-wrap: wrap; gap: 12px 40px; align-items: baseline; padding-block: 30px 40px; border-top: 1px solid #222; font-size: clamp(15px, 1.2vw, 20px); }
.pg-social a:hover { color: var(--pg-hot); }
.pg-social .who { margin-right: auto; text-transform: uppercase; color: var(--pg-dim); }

@media (max-width: 800px) {
  .pg-head, .pg-about { grid-template-columns: 1fr; }
  .pg-meta { grid-template-columns: 1fr 1fr; }
  .pg-meta .arrow, .pg-meta .sp { display: none; }
  .pg-meta .team { grid-column: 1 / -1; }
  .pg-row { gap: 10px; margin-bottom: 10px; }
  .pg-row:not(.full).stack { flex-direction: column; }
  .pg-row:not(.full).stack .pg-item { flex: none !important; width: 100%; }
}
@media (max-width: 640px) { .brand p { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .card, .inner, .page { transition-duration: .01s !important; }
  .deal-label { animation: none; }
}
</style>
</head>
<body>
<main class="table" id="table">
  <div class="rail"></div>
  <header class="brand">
    <h1>Gabo<span style="color:var(--brass)">*</span></h1>
    <p>Creative art director · São Paulo, Brasil</p>
  </header>
  <div class="dropzone" id="dropzone"></div>
  <p class="hint" id="hint">Drag a card to the table, or tap it, to play</p>
  <button class="deck" id="deck" aria-label="Deal the cards">
    <div class="deal-label">Click to Deal<small>10 JOBS IN THE DECK</small></div>
  </button>
  <button class="gather" id="gather">Gather cards</button>
</main>

<div class="page" id="page" hidden role="dialog" aria-modal="true" aria-labelledby="job-title"></div>

const table = document.getElementById("table");
const deck = document.getElementById("deck");
const hint = document.getElementById("hint");
const gatherBtn = document.getElementById("gather");
const dropzone = document.getElementById("dropzone");
const page = document.getElementById("page");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isRed = s => s === "♥" || s === "♦";
const FRAMER = "https://framerusercontent.com/images/";
const img = (file, size = 1024) => `${FRAMER}${file}?scale-down-to=${size}`;
// External media (Framer images, Vimeo players) loads on the real site but is blocked inside some previews.
// The first card cover that loads switches the job sheets to show photos and films.
let mediaOK = false;

// Decorative stack under the deck
for (let i = 0; i < 5; i++) {
  const s = document.createElement("div");
  s.className = "stack back-face";
  s.style.transform = `translate(${-i * 1.5}px, ${-i * 1.5}px)`;
  deck.prepend(s);
}

let state = "deck"; // deck | hand | playing
const cards = JOBS.map((job, i) => {
  const el = document.createElement("button");
  el.className = "card";
  el.setAttribute("aria-label", `${job.title}, ${job.client}. Play this card`);
  el.tabIndex = -1;
  const c = isRed(job.suit) ? "red" : "";
  el.innerHTML = `
    <div class="inner">
      <div class="front">
        <div class="corner ${c}">${job.rank}<span>${job.suit}</span></div>
        <div class="pip">
          <img class="thumb" alt="" src="${img(job.cover, 512)}">
          <div class="suit ${c}">${job.suit}</div>
          <div class="title">${job.title}</div>
          <div class="cat">${[job.client, job.year].filter(Boolean).join(" · ")}</div>
        </div>
        <div class="corner bottom ${c}">${job.rank}<span>${job.suit}</span></div>
      </div>
      <div class="back-face"></div>
    </div>`;
  el.hidden = true;
  const t = el.querySelector(".thumb");
  if (t) {
    t.addEventListener("load", () => { mediaOK = true; el.classList.add("has-thumb"); });
    t.addEventListener("error", () => t.remove());
  }
  table.appendChild(el);
  return { el, job, i };
});

function metrics() {
  const r = table.getBoundingClientRect();
  const cw = cards[0].el.offsetWidth || 120, ch = cards[0].el.offsetHeight || 168;
  return { w: r.width, h: r.height, cw, ch };
}

function handPose(i, n) {
  const { w, h, cw, ch } = metrics();
  const mid = (n - 1) / 2;
  const t = i - mid;
  const spread = Math.min(cw * 0.6, (w - 48 - cw) / Math.max(1, n - 1));
  const x = t * spread;
  // cards sit low, toward the viewer; the deck sits at 42% of the height
  const baseY = h * 0.535 - ch * 0.78 - Math.max(0, n / 2 - 1) * 1.2;
  const y = baseY + t * t * 2;
  const rot = t * 3.4;
  return { x, y, rot };
}

function setPose(card, x, y, rot, scale = 1) {
  const tf = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
  card.el.style.setProperty("--rest", tf);
  card.el.style.transform = tf;
}

function layoutHand(animate = true) {
  cards.forEach((c, i) => {
    if (c === playing) return;
    const p = handPose(i, cards.length);
    c.pose = p;
    if (!animate) c.el.style.transition = "none";
    setPose(c, p.x, p.y, p.rot);
    c.el.style.zIndex = 10 + i;
    if (!animate) requestAnimationFrame(() => (c.el.style.transition = ""));
  });
}

function deal() {
  if (state !== "deck") return;
  state = "dealing";
  deck.classList.add("dealt");
  deck.setAttribute("aria-hidden", "true");
  deck.tabIndex = -1;
  cards.forEach((c, i) => {
    c.el.hidden = false;
    c.el.classList.remove("up", "in-hand");
    c.el.style.transition = "none";
    setPose(c, 0, 0, 0);
    c.el.style.zIndex = 30 - i;
  });
  void table.offsetWidth;
  const step = reduced ? 0 : 140;
  cards.forEach((c, i) => {
    setTimeout(() => {
      c.el.style.transition = "";
      c.el.style.zIndex = 10 + i;
      const p = handPose(i, cards.length);
      c.pose = p;
      setPose(c, p.x, p.y, p.rot);
      setTimeout(() => c.el.classList.add("up"), reduced ? 0 : 260);
    }, i * step);
  });
  setTimeout(() => {
    cards.forEach(c => { c.el.classList.add("in-hand"); c.el.tabIndex = 0; });
    state = "hand";
    hint.classList.add("on");
    gatherBtn.classList.add("on");
    cards[0].el.focus({ preventScroll: true });
  }, cards.length * step + 700);
}

function gather() {
  if (state !== "hand") return;
  state = "dealing";
  hint.classList.remove("on");
  gatherBtn.classList.remove("on");
  cards.forEach((c, i) => {
    c.el.classList.remove("up", "in-hand");
    c.el.tabIndex = -1;
    setTimeout(() => { c.el.style.zIndex = 10 + i; setPose(c, 0, 0, 0); }, reduced ? 0 : 250 + (cards.length - i) * 50);
  });
  setTimeout(() => {
    cards.forEach(c => (c.el.hidden = true));
    deck.classList.remove("dealt");
    deck.removeAttribute("aria-hidden");
    deck.tabIndex = 0;
    deck.focus({ preventScroll: true });
    state = "deck";
  }, reduced ? 50 : 1100);
}

let playing = null;
function play(card) {
  if (state !== "hand") return;
  state = "playing";
  playing = card;
  hint.classList.remove("on");
  dropzone.classList.remove("on", "hot");
  card.el.classList.remove("in-hand");
  card.el.style.zIndex = 80;
  setPose(card, 0, 0, 0, 1.25);
  setTimeout(() => openPage(card.job), reduced ? 0 : 650);
}

const esc = t => String(t).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function mediaItem(job, it, size) {
  const style = `flex:${it.ar} 1 0;aspect-ratio:${it.ar}`;
  if (it.k === "V") {
    if (!mediaOK) return `<div class="pg-item ph" style="${style}"><a href="https://vimeo.com/${it.v}" target="_blank" rel="noopener">Watch the film ↗</a></div>`;
    return `<div class="pg-item" style="${style}"><iframe src="https://player.vimeo.com/video/${it.v}?dnt=1&title=0&byline=0&portrait=0" title="${esc(job.title)} film" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }
  if (!mediaOK) return `<div class="pg-item ph" style="${style}"><span>Image</span></div>`;
  return `<div class="pg-item" style="${style}"><img alt="${esc(job.title)}" loading="lazy" src="${img(it.v, size)}"></div>`;
}

function renderBlock(job, blk) {
  if (blk === "meta") {
    if (!job.year && !job.role) return "";
    return `<section class="pg-meta pg-pad">
      <span class="arrow" aria-hidden="true">↳</span>
      <div><h3>Year</h3><p>${esc(job.year)}</p></div>
      <div><h3>Role</h3>${job.role.split(/,\s*/).map(r => `<p>${esc(r)}</p>`).join("")}</div>
      <div class="team"><h3>Team</h3><p>${esc(job.team)}</p></div>
      <span class="sp"></span>
    </section>`;
  }
  if (blk === "about") {
    if (!job.about) return "";
    return `<section class="pg-about pg-pad">
      <h2>About the project</h2>
      <div><p>${esc(job.about)}</p>${job.award ? `<p class="award">${esc(job.award)}</p>` : ""}</div>
    </section>`;
  }
  const total = blk.items.reduce((n, it) => n + it.w, 0) + (blk.items.length - 1) * 0.018;
  const t = Math.min(1, total);
  const maxw = blk.full || t > .98 ? "100%" : `calc(${t.toFixed(3)} * (100% - 2 * var(--pg-gut)) + 2 * var(--pg-gut))`;
  const stack = blk.items.length > 1 && blk.items.length < 3 ? " stack" : "";
  return `<div class="pg-row${blk.full ? " full" : ""}${stack}" style="max-width:${maxw}">${blk.items.map(it => mediaItem(job, it, blk.full || it.w > .6 ? 2048 : 1024)).join("")}</div>`;
}

function openPage(job) {
  const [a, b] = job.colors;
  const next = JOBS[(JOBS.indexOf(job) + 1) % JOBS.length];
  const blocks = job.blocks.slice();
  if (!blocks.includes("meta")) blocks.splice(1, 0, "meta");
  if (!blocks.includes("about")) blocks.push("about");
  page.style.setProperty("--a", a);
  page.style.setProperty("--b", b);
  page.innerHTML = `<div class="pg-inner">
    <nav class="crumbs pg-pad" aria-label="Breadcrumb">
      <button class="link" data-back>Home</button><span class="arrow" aria-hidden="true">↳</span>
      <button class="link hot" data-back>Works</button><span class="arrow" aria-hidden="true">↳</span>
      <span class="here">${esc(job.title)}</span>
      <span class="rank ${isRed(job.suit) ? "red" : ""}" aria-hidden="true">${job.rank}${job.suit}</span>
    </nav>
    <header class="pg-head pg-pad">
      <div>
        <h1 id="job-title">${esc(job.title)}</h1>
        <div class="pg-sub"><span>${esc(job.client)}</span>${job.agency ? `<span>@${esc(job.agency)}</span>` : ""}</div>
      </div>
      <div><p class="pg-label">Overview</p><p class="over">${esc(job.overview)}</p></div>
    </header>
    ${blocks.map(blk => renderBlock(job, blk)).join("")}
    <footer>
      <div class="pg-foot pg-pad">
        <button class="link" data-back>↳ Back to the table</button>
        <button class="link next" data-next>Next project ↳<small>${esc(next.title)}</small></button>
      </div>
      <div class="pg-social pg-pad">
        <span class="who">Gabo Moraes · Creative art director</span>
        <a href="https://www.instagram.com/moraesgabo" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.linkedin.com/in/moraesgabo/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://gabomoraes.work/work/${job.slug}" target="_blank" rel="noopener">Original page ↗</a>
      </div>
    </footer>
  </div>`;
  page.querySelectorAll("[data-back]").forEach(el => el.addEventListener("click", () => closePage()));
  page.querySelector("[data-next]").addEventListener("click", () => closePage(cards[JOBS.indexOf(next)]));
  page.scrollTop = 0;
  page.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => page.classList.add("open")));
  page.querySelector("[data-back]").focus({ preventScroll: true });
}

function closePage(thenPlay) {
  if (state !== "playing") return;
  page.classList.remove("open");
  setTimeout(() => { page.hidden = true; page.innerHTML = ""; }, reduced ? 0 : 400);
  const card = playing;
  playing = null;
  const p = handPose(card.i, cards.length);
  card.el.style.zIndex = 10 + card.i;
  setPose(card, p.x, p.y, p.rot);
  setTimeout(() => {
    card.el.classList.add("in-hand");
    state = "hand";
    if (thenPlay) return play(thenPlay);
    hint.classList.add("on");
    card.el.focus({ preventScroll: true });
  }, reduced ? 0 : 500);
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closePage(); });
deck.addEventListener("click", deal);
gatherBtn.addEventListener("click", gather);

// Drag to play. A short press without movement counts as a tap and also plays.
cards.forEach(card => {
  let start = null;
  card.el.addEventListener("pointerdown", e => {
    if (state !== "hand") return;
    start = { x: e.clientX, y: e.clientY, moved: false };
    card.el.setPointerCapture(e.pointerId);
  });
  card.el.addEventListener("pointermove", e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!start.moved && Math.hypot(dx, dy) < 6) return;
    if (!start.moved) { start.moved = true; card.el.classList.add("dragging"); dropzone.classList.add("on"); }
    const p = card.pose;
    setPose(card, p.x + dx, p.y + dy, p.rot * Math.max(0, 1 + dy / 200));
    dropzone.classList.toggle("hot", dy < -metrics().ch * 0.7);
  });
  const end = e => {
    if (!start) return;
    const dy = e.clientY - start.y, moved = start.moved;
    start = null;
    card.el.classList.remove("dragging");
    dropzone.classList.remove("on", "hot");
    if (!moved || dy < -metrics().ch * 0.7) play(card);
    else setPose(card, card.pose.x, card.pose.y, card.pose.rot);
  };
  card.el.addEventListener("pointerup", end);
  card.el.addEventListener("pointercancel", () => { if (!start) return; start.moved = true; end({ clientY: Infinity }); });
  card.el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(card); }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const n = cards[(card.i + (e.key === "ArrowRight" ? 1 : cards.length - 1)) % cards.length];
      n.el.focus({ preventScroll: true });
    }
  });
});

addEventListener("resize", () => { if (state === "hand" || state === "playing") layoutHand(false); });
</script>
